name: lab
transport: stdio
command: {{PYTHON}}
args: [-m, lab.lab_server]
env:
  PYTHONPATH: {{REPO}}
  STARGAZER_TASK: {{TASK}}
  STARGAZER_RUN_DIR: {{RUN_DIR}}
  STARGAZER_MAX_OBSERVATIONS: "{{MAX_OBSERVATIONS}}"
  STARGAZER_OBS_PER_CAMPAIGN: "{{OBS_PER_CAMPAIGN}}"
  STARGAZER_MAX_COMPUTE_ROUNDS: "{{MAX_COMPUTE_ROUNDS}}"
tools: [task_summary, periodogram, note]
